# Every push to master runs the same checks as `npm run verify:all`.
#
# This exists because nothing else runs them: the Netlify build only ever ran `npm run build`,
# never a verifier, and its deploys are paused. Without this workflow the checks depend on
# somebody remembering to type them.
name: verify

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches netlify.toml and the Pages build variable, so the build under test is the
          # build that would be deployed.
          node-version: '22'
          cache: npm

      - run: npm ci

      # The loader check drives a real Chromium; the library ships without one. Run the project's
      # own CLI, not `npx playwright`: that name is not in our dependencies, so npx downloads a
      # fresh `playwright` from the registry and can fetch a browser revision that the pinned
      # playwright-core does not look for.
      - run: ./node_modules/.bin/playwright-core install --with-deps chromium

      # Build + every verifier, including the Pages check on workerd (the script starts and stops
      # wrangler itself) and the one network-dependent check, which runs last.
      - run: npm run verify:all
